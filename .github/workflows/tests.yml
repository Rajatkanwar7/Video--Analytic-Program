name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-video:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-base.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q jailwatch scripts
      - run: python -m jailwatch doctor
