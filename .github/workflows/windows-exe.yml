name: Build Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'jailwatch/**'
      - 'scripts/**'
      - 'tests/**'
      - 'packaging/**'
      - 'assets/**'
      - 'requirements*.txt'
      - 'vms_main.py'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU AI and packaging dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt PyInstaller==6.22.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test source on Windows
        run: python -m unittest discover -s tests -v
      - name: Prepare loopback RTSP interoperability test
        run: |
          python scripts/download_rtsp_test_server.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "JAILWATCH_RTSP_TEST_SERVER=$((Resolve-Path build_assets/mediamtx.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build packaged desktop application
        run: python scripts/build_windows.py
      - name: Test real EXE, bundled AI, camera grid, recording and playback
        run: |
          $test = Start-Process -FilePath "dist/JailWatchVMS/JailWatchVMS.exe" -ArgumentList "--self-test", "$PWD/exe-validation.json", "--screenshot", "$PWD/vms-preview.png" -PassThru
          if (-not $test.WaitForExit(240000)) { Stop-Process -Id $test.Id -Force; throw 'EXE self-test timed out' }
          if ($test.ExitCode -ne 0) { Get-Content exe-validation.json -ErrorAction SilentlyContinue; throw 'EXE self-test failed' }
          $report = Get-Content exe-validation.json | ConvertFrom-Json
          if (-not $report.passed) { throw 'EXE validation did not pass' }
      - name: Create portable ZIP and setup EXE
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item exe-validation.json dist/JailWatchVMS/exe-validation.json
          python -c "import shutil; shutil.make_archive('release/JailWatchVMS-2.0.1-Windows-x64', 'zip', 'dist', 'JailWatchVMS')"
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler packaging/JailWatchVMS.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' })
          $packages | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt
          Copy-Item exe-validation.json release/exe-validation.json
          Copy-Item vms-*.png release/
      - name: Verify setup installation under a normal user path
        run: |
          $destination = "$env:RUNNER_TEMP\JailWatch-installed"
          $install = Start-Process -FilePath "release/JailWatchVMS-Setup-2.0.1-x64.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$destination" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw 'Setup installation failed' }
          $test = Start-Process -FilePath "$destination\JailWatchVMS.exe" -ArgumentList '--self-test', "$PWD/installed-validation.json" -PassThru
          if (-not $test.WaitForExit(240000)) { Stop-Process -Id $test.Id -Force; throw 'Installed EXE self-test timed out' }
          if ($test.ExitCode -ne 0) { throw 'Installed EXE failed self-test' }
          $report = Get-Content installed-validation.json | ConvertFrom-Json
          if (-not $report.passed) { throw 'Installed application validation did not pass' }
          Copy-Item installed-validation.json release/installed-validation.json
      - name: Upload build checks and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-checks
          path: |
            exe-validation.json
            installed-validation.json
            vms-*.png
            build/JailWatchVMS/warn-JailWatchVMS.txt
          if-no-files-found: ignore
      - name: Publish verified Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.0.1-$($env:GITHUB_SHA.Substring(0,7))"
          $assets = @((Get-ChildItem release -File).FullName)
          gh release create $tag --target $env:GITHUB_SHA --title "JailWatch VMS 2.0.1 — Windows pilot" --notes-file docs/RELEASE_NOTES_2.0.md --latest @assets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
